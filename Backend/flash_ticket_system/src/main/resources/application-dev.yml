spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_system_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver 

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
